version: 1
project:
  name: "Facet"
  purpose: "Windows 전체 화면 오버레이에서 일정·할 일·컨디션을 관리하고 빠른 실행을 제공한다."
architecture:
  style: neutral-contract
  layers: [Core, Plugins, Desktop, Launcher, Checks]
  boundaries:
    - "First-party plugin sources (clock, weather, schedule, condition, sleep, sample) live in impls/ and are public; chat and music plugins were removed (ADR0104)."
    - "Desktop/Packages installs a zip with plugin.json or skin.json at its root into <data>/plugins or <data>/skins, from a checked staging copy, and never enables or runs anything. Design/ExternalSkins reads <data>/skins/<folder>/skin.json as validated data (color tokens, ThemeManifest slots, PNG; never XAML) and Design/Skins lists it after the built-ins, which keep their ids. Desktop/PackageRegistry reads the public index.json of the GitHub registry only on request and installs only release files of that repository whose SHA-256, kind, id and version match the list. Desktop/PackagesPanel (plugins) loads the list once when first shown, and a click on a list row downloads and enables or reloads the plugin; zip and folder plugins stay user-enabled. Desktop/SkinsPanel is the skin tab's one list: installed skins apply by radio and carry an update or unsupported chip against the registry (an unlisted skin still applies and can only be removed), and registry-only skins below install without applying. It holds no tokens: submitting builds a zip and opens the browser form. The registry is registry/ of this repository (material-stone/facet): the app reads main's registry/index.json and accepts only this repository's release files; .github/workflows/package-submission.yml publishes skins after validation and holds plugins as pull requests for admin approval. OverlayTabs.UninstallPlugin turns a plugin off, removes its placements and widget stores, deletes its folder (a folder still in use is marked .removed, hidden by PluginHost.Discover and deleted on a later Discover) and removes plugin-data and settings only when asked. See ADR0088, ADR0097, ADR0103."
    - "scripts/package.ps1 builds the portable zip from a temporary source copy: launcher and app share one app-relative runtime/ folder, latest.json selects releases/portable, and Desktop/PortablePlugins copies bundled-plugins into <data>/plugins once per package id without enabling them; a checkout without plugin projects packages the plain app. installer/Facet.iss wraps that folder in a per-user Inno Setup installer and .github/workflows/release.yml builds, install-tests and publishes both on a v<version> tag. See ADR0087, ADR0098."
    - "Launcher/LaunchProtocol resolves the records folder MaterialStone/Facet (the old DailyDock folder until App moves it once while no instance holds it). Desktop/DataBackup zips the records folder and stages a restore beside it that App applies after taking the instance mutex. Settings own the overlay, quick launch and exit hotkeys. QuickLaunchCatalog.Extras hides help, paths, aliases and web search. See ADR0099."
    - "Desktop/QuickLaunchModes hosts ILauncherSession views around the unchanged centered input and owns the one flyout; Controller registers plugin hotkeys (ids from 200, apart from its own three, each failing alone) and lists plugin tray commands when the menu opens; PluginShell is one plugin's IPluginShell. PluginHost's load context resolves native DLLs from the plugin folder and shares the app's WinRT projection. See ADR0084."
    - "Facet.SleepPlugin owns the sleep widgets (pattern, duration), the record editor modal (IWidgetModal; a failed save keeps the modal and stops hiding and exit through TrySaveEdits), sleep rules (wake-date key, partial records, null is unknown, original-compare save and delete, shared Minutes display value) and facet_record_sleep/facet_list_sleep. Store.Load backs up, moves, verifies and only then clears Sleep and RemovedSleep from records.dat; the store wins per wake date. The app holds no sleep code; only input-only AppData.Sleep/RemovedSleep, SleepEntry, Settings.SleepGraphTransparencyPercent, LegacySleep and PluginData.MoveSleep remain. The sleep tab is an ordinary board; layouts below GridVersion 4 get the pattern widget once. See ADR0083."
    - "Desktop/Widgets/ClockFitButton (source-linked into Facet.ClockPlugin) makes both clock widgets a tile-filling button: the face keeps its ratio at the largest fit, and a nine-button modal picks its alignment, saved per placement in WidgetStores. See ADR0082."
    - "Facet.SystemMonitorPlugin (facet.sysmon) shows CPU, GPU and memory ring gauges and a network graph. One SystemSampler per plugin reads Win32 (GetSystemTimes, GlobalMemoryStatusEx, PDH GPU Engine) once a second on a pool thread only while a widget is visible; views draw with skin tokens and animate (spring, alert pulse over 90%, peak hold, boot sweep) only while visible. No temperature reading. See ADR0106."
    - "Facet.ClockPlugin also offers the weekday and time widgets (ClockFaceView): the ClockFitButton modal adds a face picker above the alignment grid, and mode (analog/digital) and style are saved per placement in WidgetStores; faces draw with skin tokens only. See ADR0102."
    - "Facet.ConditionPlugin owns the condition widgets (current fills its grid slot; history), condition rules, icons and facet_set_condition/facet_list_conditions. Desktop/PluginFileStore gives each plugin <data>/plugin-data/<id>.dat through IWidgetRegistry.Store (DPAPI, atomic, .bak1-5; outlives the plugin folder). Store.Load backs up, moves, verifies and only then clears records from records.dat; the store wins per instant. The app holds no condition code; only input-only AppData.Conditions, ConditionEntry, LegacyConditions and PluginData.MoveConditionWidgets remain to move old records once. See ADR0081."
    - "Desktop/WidgetModalHost presents one widget-owned view over the whole overlay via WidgetContext.Modal: backdrop, frame, focus cycle, tab block and close rules only; content and state stay with the widget. See ADR0078."
    - "Facet.SchedulePlugin (facet.schedule) owns the calendar widget (month calendar and day page in one tile; its schedule editor sits on the overlay through IWidgetLayer), the agenda widget and facet_today/facet_list_schedules/facet_add_schedule/facet_delete_schedule. Its store is plugin-data/facet.schedule.dat in the CalendarStoreFile format; the rules stay in Core CalendarNotes, DaySchedules, DashboardAgenda and AgentToolCatalog helpers, which the plugin uses through the host-shared Facet.Core. Desktop/Store moves calendar.dat (kept as calendar.dat.moved) and any days or presets still in records.dat into that store once, backed up and verified, and gives a never-edited layout LegacyDefault. The app has no widgets of its own: WorkspaceLayouts.Default is an empty dashboard and settings, and PluginData moves builtin.clock/weather/agenda/calendar placements and stores to the plugin widget ids. Widget views implementing IWidgetInput get Escape and keys on their tab and TrySave before leaving. See ADR0101."
    - "Core/WorkspaceLayouts owns tab rules and placement validation for optional AppData.Workspace (missing = default layout) and EnabledPlugins. Placements are board pixels (GridVersion 7 multiplies older cell placements by the stored cell size once); overlaps are rejected; the grid cell size (2-160 px) is only what edit mode snaps to, and WorkspaceLayout.Snap turns snapping off. WidgetDescriptor.Width/Height (default DefaultColumns/DefaultRows x 96) is a widget's base size: Desktop/OverlayWorkspaceView lays each view out at its base size and stretches it to the tile (WidgetStretch), keeping panels and edit handles at tile size; a corner drag stretches freely, Shift keeps the ratio, Alt inverts snapping; new widgets go to the center of the view or the nearest free spot. OverlayTabs.Workspace owns the widget catalog, tab sync and widget instances. The tab strip is the app's tab bar widget (builtin.tabs) with one placement shared by every tab (WorkspaceLayout.TabBar, null = top center of the first view); it cannot be removed. There is no settings tab: a fixed top-right icon menu opens widget editing and the settings modal (ADR0109). Tabs can be renamed, removed and hidden while one stays visible, and pick an icon from Desktop/TabIcons presets, saved as optional WorkspaceTab.Icon (ADR0085). Facet.Plugins is the only plugin contract (UI types only, no Core/Store). Desktop/PluginHost reads <data>/plugins/*/plugin.json and runs code only for user-enabled plugins, each in its own AssemblyLoadContext; at launch an enabled plugin loads its current files and adopts their SHA-256 (ADR0079). Plugins are in-process and not sandboxed. See ADR0073."
    - "Desktop/Design/Tokens.xaml is the single owner of skinnable app UI colors; views reference them by token key. Desktop/Design/Skins owns the one built-in skin option (default, dark tokens; every other skin is a package in registry/skins, ADR0100) and merges the selected Design/Skins/<Id>.xaml over Tokens at Controller startup before the first window (optional Settings.Skin; missing or unknown = default); a saved change reloads tokens and Components and rebuilds the overlay content (ADR0077). User data colors, ConditionIcons kind colors and color-picker functional colors are not tokens. External skins must be validated data, never loaded XAML. See ADR0074."
    - "Desktop/Design/ThemeVisuals owns optional per-skin visual slots (Design/Skins/<Id>/theme.json: background image and opacity, live nebula speed and brightness, built-in star count, 9-slice widget frame, panel corner marks and radius, tab bar corner radius), their validation and loading; invalid manifests leave tokens only. ThemePanels restyles non-templated Borders painting the Panel token only when a skin fills those panel slots. OverlayWindow draws the background above the tint and below the tabs, hidden in quick launch and never hit-tested; OverlayWorkspaceView draws the panel (theme frame or token surface) only behind tiles whose WidgetDescriptor.HasPanel is true; the music plugin's player is one such widget. Themes carry no code or layout, and the format stays internal until external themes are opened. See ADR0077."
    - "Desktop/Design/WorldBackdrop (theme slot world {page, scenes}) runs the skin's own HTML page in WebView2 in its own input-less window kept directly below the layered overlay; the overlay takes every click and forwards unhandled left clicks as next with x and y as 0..1 fractions of the overlay (ADR0107). The host enforces no network (prepended CSP, dead proxy, WebRTC policy, cancelled navigation) and sends scenes, weather key, visible and next; with theme slot widgets it also sends { widgets:[{id,type,x,y,width,height,baseWidth,baseHeight,state}] } in overlay window pixels (board pixels through the board's pan and zoom), { pointer:{id,kind move|down|up|wheel|leave,x,y,delta,button} } in widget base-size pixels over skin-drawn tiles outside edit mode, and { actionResult:{id,name,ok,result,error?} } for each { type:'action',id,name,args } it accepts only for a skin-drawn widget of the shown tab (Design/SkinWidgets, OverlayTabs.SkinLayer, ADR0110). Privacy: widget state carries user records (schedule titles, condition, sleep) to the page; the network lock is unchanged and skins with a page wait for admin review. Theme slot fonts maps skin font files to AppFontFamily and HudHeadingFont. See ADR0091. No tint, blur or capture while a world is active. A missing runtime or page failure drops the world and keeps the tokens. See ADR0090."
    - "Desktop/Design/SpaceVoyage (theme slot voyage) draws baked, code-generated planets as Viewport3D spheres behind the tabs while visible; VoyagePlan is pure and keeps every planet's axis distance at least 1.2x its extent, so passes never penetrate the camera. Design/VoyageDebugPanel (F8, session only) spawns a planet at a slider-chosen spot and scales flight time x1-x10; see ADR0093. Theme slot hudWidgets sets Facet.Plugins WidgetTheme.HudKey; widgets pick their HUD form through WidgetTheme.IsHud and every tile gets a panel. Widget looks beyond the HUD forms belong to the skin's world page (ADR0110, superseding ADR0108): WidgetTheme.IsCatHud/CatHudKey and WidgetDescriptor.HasCatPanel stay only for binary compatibility, are [Obsolete] and inert. Core/DaySchedules owns previous/current/next schedule projection. Layout stays the user's. See ADR0086."
    - "Core/AgentToolCatalog holds only pure argument parsing and schedule edits that the schedule plugin registers as its tools; the app owns no agent tools. Plugins register tools with IWidgetRegistry.AddAgentTool and PluginHost lists them, but no MCP server, CLI or pipe serves them until an agent interface returns. See ADR0105."
    - "scripts/build.ps1은 배포 경로별 mutex로 빌드를 직렬화하고 새 publish와 latest.json 원자 교체 성공 후 최신 release만 유지한다. 실패한 새 release·staging은 정리하되 이전 선택은 보존한다. 실행 중이거나 잠긴 이전 release는 강제 종료·부분 삭제 없이 건너뛰고 다음 성공 빌드에서 재시도한다. latest.previous.json은 유지하지 않는다. 사용자 저장소는 정리 대상이 아니다."
    - "Desktop/Controller: 사용자 화면은 OverlayWindow와 빠른 실행뿐이다. 오버레이 HWND로 세 전역 단축키(오버레이·빠른 실행·종료)와 화면 변경을 수신한다. 일반 관리 창·전용 메뉴·수면/제작 단축키·수면 예약 알림·시작 계획 생성은 제거한다. 사용자 알림의 열기는 오버레이로 연결한다. 저장 실패는 초안을 보존하고 종료/업데이트를 취소한다."
    - "Core/LegacyRecords와 Models: v1/v2 작업·계획·프로젝트 일지·구형 설정은 저장 호환 DTO로만 유지하며 자동 생성·편집·분석·CSV 기능을 제공하지 않는다. 수면은 Facet.SleepPlugin에서만 편집한다. 저장 성공 후에도 기존 기록을 보존한다."
    - "ConditionPlugin: 게이지는 같은 기록의 MouseDown→MouseUp 완료 후 캡처를 해제하고 편집 Popup을 연다. ConditionRecordEditor는 변경 즉시 ConditionRecords.Commit으로 저장하고 성공마다 원본 키를 갱신하며 실패 초안·재시도를 유지한다. 오른쪽 끝 삭제만 확정 후 닫는다. 단일 기록 시각 버튼의 ConditionDateTimePicker는 플러그인 자체 ConditionDateCalendar와 시/분/초 선택을 사용하며 중첩 Popup의 Esc/닫힘을 내부부터 처리한다."
    - "Desktop/OverlayAppearance는 선택 필드 Settings.OverlayTransparencyPercent(0–100)와 OverlayBackgroundColor(#RRGGBB)를 해석한다. 투명도 미지정 시 구버전 Opacity와 기존 60% 색조 alpha를 변환해 보이는 진하기를 유지한다. 오버레이 설정 화면은 투명도 0%=불투명,100%=투명과 같은 OverlayColorPalette를 사용한다. OverlayWindow는 전경 opacity를 유지하고 불투명 RGB brush의 alpha만 조절한다. 완전 투명은 blur/capture도 해제하며 빠른 실행의 배경 효과 해제는 보존한다. 색상·투명도는 오버레이 자동 저장과 실패 초안 보존 경계를 따른다."
    - "ConditionPlugin/ConditionTracking.Update/Delete는 원본 시각·종류를 대조하고 미래·중복 시각을 거절한다. ConditionSpan.RecordedAt은 범위에 잘리기 전 원본을 가리킨다. ConditionRecordEditor는 구간 클릭의 조회·수정·삭제 초안을 소유하고 저장 실패 시 유지한다. 위젯 아이콘·선택 목록·게이지는 Tab 탐색에서 제외하고 별도 편집 팝업의 입력만 포커스를 허용한다."
    - "ConditionPlugin/ConditionTracking은 선택 시각·종류 검증과 구간 투영만 수행하고 ConditionRecords가 플러그인 저장소에 저장한다. 최근 7일(6일 전 00시~내일 00시) 게이지에서 최초 기록 전과 미래는 투명하다. 마지막 상태는 다음 선택까지 이어지고 기록은 AI·날씨·CLI로 자동 전송하지 않는다."
    - "Desktop/OverlaySettingsView: 아이콘 메뉴로 여는 설정 모달(Esc·바깥 클릭은 저장 후 닫음, ADR0109) 안의 최대 폭 800 DIP, 검색 입력·스크롤 그룹·설정별 좌우 행·이름 설명 툴팁을 소유한다. 이름·설명·현재 입력값을 실시간 검색하고 일치 텍스트를 강조하며 빈 그룹은 숨긴다. 검색은 입력 컨트롤을 재생성하지 않아 초안을 보존한다. SettingsEditing의 공통 검증·시작 등록과 기존 Controller.ApplySettings/Store를 사용하고 변경한 필드만 최신 설정 복사본에 적용한다. 체크·슬라이더·선택은 즉시, 텍스트는 300ms 입력 정지 후 자동 저장하며 검색 입력은 저장하지 않는다. 저장 성공 시 컨트롤·커서·IME·드래그·스크롤을 유지하고 baseline만 갱신한다. 행 최소 높이 44 DIP·상하 5 DIP 간격을 사용한다. 미완성 입력과 저장 실패 시 초안을 유지하고 인라인 오류와 재시도를 제공한다."
    - "Core/CalendarNotes: CalendarDayEntry.Schedules는 선택 목록으로 30분 단위 시작·길이(자정 통과/24시간 포함), 이름·색상/레이블·내용을 검증하고 깊은 복사한다. 일정은 실제 시작 날짜의 CalendarDayEntry에 한 번 저장한다. SchedulesForDate는 모든 이전 시작 날짜의 다일 일정과 당일 일정을 선택 날짜의 구간으로 투영하고 SaveSchedule은 날짜 이동/노트/할 일을 원자적으로 갱신한다. 화면용 StartDayOffset/OwnerDate는 JsonIgnore로 저장하지 않는다. Desktop/OverlayScheduleDial은 24시간 부채꼴, hover·드래그·겹침 반경·다이어그램과 다른 레이블을 피하는 가까운 연결 레이블을, OverlayScheduleEditor는 내부 모달을 소유한다. OverlayTabs는 관리 화면의 중앙 달력과 하루 화면을 좌우 이동/페이드 전환하며 하루 화면에서만 기존 OverlayDayEditor를 표시한다. Esc는 날짜·시간 선택 → 일정 편집 → 기록 입력 → 일정 관리 → 기본 달력 순으로 최상위 활성 모드만 종료한다. 기록 입력 종료는 저장 성공 시 보기로 돌아가고 실패 시 초안을 유지한다. 다이얼과 뒤로 가기 버튼은 포커스를 받지 않으며 뒤로 가기 버튼은 클릭과 Esc로 동작한다. 모달 종료·다이얼 조작 시 Tab 정지점이 아닌 DayPage에 입력 포커스를 두어 Esc를 유지하고 Tab은 탭 메뉴에서 할 일 입력으로 이동한다. 일정 수정 창의 Esc/바깥 클릭은 초안을 검증·저장한 후 닫고 입력을 뒤쪽 화면에 전달하지 않는다. 검증/저장 실패 시 모달과 초안을 유지한다. 새 일정의 현재 이름/내용이 모두 공백뿐이면 색상·레이블·날짜/시간 변경 여부와 관계없이 저장을 호출하지 않고 닫는다. 기존 일정에는 이 예외를 적용하지 않는다. DaySchedule.Name은 내용이 있으면 빈 문자열을 허용하고 null과 이름/내용 동시 공백 저장은 거절한다. 내용만 작성한 일정도 같은 검증·원자 저장을 사용하며 다이얼은 이름이 없으면 내용의 첫 텍스트 줄(선행 빈 줄/공백 제외)을 레이블로 표시한다. 모든 일정 레이블은 한 줄로 제한하고 폭을 넘으면 말줄임표를 표시하며 저장 이름과 전체 내용은 바꾸지 않는다. 실제 폭을 넘는 레이블에만 전체 레이블 문자열의 공용 다크 툴팁을 제공하고 이탈·클릭/드래그·데이터 교체·숨김 시 닫는다. 날짜·시간 선택 중에는 그 선택 창만 먼저 닫는다. 생성 가능한30분 격자 칸만 흐린 테두리로 안내하고 기존 일정 hover는 약한 테두리·작은 들림·벡터 그림자를 사용한다. 레이블 배경·위치와 연결선은 고정하고 레이블 테두리만 강조한다. 들린 면과 원래 면의 입력 판정은 안정적으로 유지한다. 일정 몸통 드래그는 기간을 보존해 시작/끝을 함께 이동하고 실제 시작/끝 경계 드래그는 해당 시각만30분 단위로 조정한다. 자정 양방향 통과는 signed range로 미리보기하며 이웃 날짜는 반투명, 드롭 후 원자 저장·현재 날짜 구간 투영을 사용한다. 실패 초안은 기존 일정 모달에서 유지하고 Esc/캡처 이탈은 취소한다. 호 양끝 모서리는 원호와 변에 접하는 둥근 geometry를 사용한다. 현재 시각 바는 입력을 가로채지 않는 최상단 DrawingVisual로 그리며 로컬 시각을 초 단위로 RotateTransform에 반영한다. 표시 중에만 timer를 실행하고 숨김/해제 시 중지하며 일정/레이블 전체를 시계 tick마다 다시 그리지 않는다. 일정 시간은 하나의 작은 달력에서 시작일→종료일을 순서대로 선택하고 시작/끝 시간을 갖춘 독립 Canvas 레이어를 버튼 아래에 배치해 편집한다. 선택 창은 부모 측정에 참여하지 않으며 내용 높이와 남은 화면 높이에 맞춘다. 날짜·시간은 선택 즉시 초안에 반영하고 선택 창에는 확인/취소나 중복 요약을 표시하지 않는다. Esc/바깥 클릭은 변경값을 유지하며 선택 창만 닫고 일정 수정 창은 확인/취소 버튼 없이 Esc/바깥 클릭으로 저장 후 닫으며 기존 일정의 삭제 버튼만 제공한다. 종료일은 시작일 이전만 비활성화하며 종료 시각은 시작 이후30분 이상인 선택지만 활성화한다. 24시간 길이 제한은 없고 DurationMinutes는 JSON 정수 호환 long으로 전체 DateOnly 범위를 지원한다. 달력 기록 표시는 날짜별 조회로 긴 기간의 날짜 전개를 피한다. 일정 모달은 기존 폭의2/3이며 내용 높이에 맞춰 중앙 배치한다. 관리 화면에는 달력/하루 콘텐츠 한 개만 두고 캐러셀 드래그를 시작하지 않는다. 일정과 할 일·기록은 같은 초안/Store로 저장한다."
    - "Desktop/ToastWindow: 일반 실행·기존 인스턴스 재실행은 Controller.HandleLaunch에서 ShowOverlayOnLaunch=false일 때 주 모니터 WorkingArea 가로 중앙의 작업 표시줄 위에 실행 토스트를 표시하며 true이면 오버레이만 열고 실행 토스트를 표시하지 않는다. 단축키 없이 13 DIP 안내 한 줄과 좌우12/상하7 DIP 패딩으로 내용에 맞춰 작게 표시한다. 200ms fade-in 완료 후 2초 유지하고 200ms fade-out 후 닫는다. hover 동안 자동 종료를 멈추고 이탈마다 새2초 대기를 시작한다. 자동·클릭 종료 모두 페이드아웃 중 재진입하면 종료 상태를 해제하고 현재 투명도부터200ms 복구하며 이전 전환 완료는 무시한다. 클릭을 소비해 hover 중에도 현재 투명도부터 즉시200ms fade-out하며 반복 클릭은 종료를 지연하지 않는다. 포커스를 빼앗지 않고 작업 표시줄 항목·알림 이력을 만들지 않는다. 자동/트레이 시작·자동 재실행은 실행 토스트를 띄우지 않는다. 기존 일정 토스트의 버튼·20초 수명은 유지한다."
    - "Desktop/QuickLaunch: Win+Alt+Space로 OverlayWindow의 입력 모드를 열며 Desktop/QuickLaunchCatalog가 PATH의 실행 파일과 alias·절대 경로 후보를 조회한다. 빈 입력은 플레이스홀더 없이 표시한다. > 접두사는 내부 예약 명령어를 후보·고스트·Tab 완성으로 제공하며 > help의 Enter/클릭 실행은 입력란 위 기본/@/ 도움말을 토글하고 입력을 비운다. 도움말은 다른 검색 중에도 유지한다. Core의 선택 필드 Settings.LauncherSearchEngine은 Google/Naver/Bing이며 구형 누락 값은 Google이다. 기존 오버레이 설정의 검색 엔진 선택은 공통 검증·자동 저장·실패 초안 경계를 따른다. Desktop/QuickLaunchWebSearch는 ?+공백 모드의 선택 엔진 HTTPS 검색 URL·URI query 인코딩·HTTP/HTTPS 주소 판별·현재 사용자 기본 HTTPS 브라우저 연결 조회를 소유한다. ? 검색어의 명시적 Enter 때 최신 설정을 읽고 UseShellExecute로 연다. 빈 검색어는 입력을 유지한다. ? 뒤의 도메인·localhost·IP 주소는 HTTPS를 보충하고 경로·포트·query·fragment를 유지하며 완전한 HTTP/HTTPS URL은 ? 없이도 연다. 일반 텍스트·다른 scheme는 검색어로 인코딩한다. ? 공백만 입력해도 기본 브라우저 아이콘을 작업 스레드에서 세션당 한 번 조회하고 검색어 수정 중 유지한다. 아이콘 완료는 실행을 막지 않으며 늦은 세대·숨긴 세션 결과는 버린다. 검색어를 미리 전송하거나 저장하지 않고 앱 후보·고스트는 숨긴다. 예약 명령어는 OS 아이콘 조회·프로세스 실행으로 전달하지 않는다. 도움말 내부 클릭·스크롤은 입력 모드를 유지한다. 입력란·후보·요청한 도움말만 표시하고 모니터 배경 alpha·blur는 0, 캡처는 해제한다. 일반 모드 복귀 시 저장된 효과를 다시 적용한다. 입력란은 모니터 중앙에 고정하고 후보·아이콘·고스트 완성은 메모리에만 유지한다. 텍스트 변경 중 기존 아이콘을 유지하고 현재 대상의 아이콘 조회 완료 후 교체하며 같은 대상의 완료된 아이콘을 재사용한다. 사용자의 Enter/클릭 후에만 실행하며 @ 경로와  alias는 Explorer로 연다. Settings.LaunchAliases는 선택 필드로 기존 Store에 암호화 저장하며 누락 시 빈 목록이다. Esc·입력란/후보 목록 밖 클릭은 입력 모드를 숨기고 검색을 취소하며 바깥 클릭 숨김은 포커스를 복원하지 않는다. 창 비활성화는 입력창·검색·표시 요청을 유지한다. Core는 Windows 검색·프로세스·아이콘 API를 참조하지 않는다."
    - "Core: 순수 모델, 일정·사용자 알림 검증과 구형 저장 DTO. UI와 운영체제에 의존하지 않는다."
    - "Desktop: WPF 화면, Windows 단축키/트레이, DPAPI 저장, 알림 실행. Core를 사용한다."
    - "Launcher: 고정 실행 경로와 latest.json 검증·인자 전달·기존 앱의 정상 종료 요청을 소유한다. 완성된 releases 하위 배포본만 실행하며 사용자 기록을 읽지 않는다. Desktop은 공유 LaunchProtocol과 작업 표시줄 재실행 속성으로 실행기와 연결한다."
    - "Desktop/OverlayWindow: 일반 실행·재실행의 표시 여부는 Settings.ShowOverlayOnLaunch(누락 시 true)를 따른다. --autostart/--tray 시작과 기존 인스턴스 요청은 표시·활성화·업데이트 확인 창 없이 숨김을 유지한다. 로그인 Run 등록은 --autostart --tray를 붙이며 설정에서 별도로 토글한다. 명시적인 단축키·트레이 열기는 시작 표시 설정과 독립적이다. 일반 오버레이와 빠른 실행은 전경 창 위치와 관계없이 Windows 주 모니터의 전체 Bounds에만 표시하며 화면 구성 변경 때도 다시 맞춘다. 두 모드는 창 비활성화 후에도 표시 요청과 입력을 유지하며 포커스 이탈로 숨기지 않는다. Deactivated는 캡처 도구에 따른 Topmost만 갱신한다. 단축키·모드별 Esc·빠른 실행 내부 바깥 클릭·명시적 숨김은 기존 저장·페이드 경로를 유지한다. 캡처 도구 우선 표시와 비활성화 상태의 Topmost 복구는 포커스를 빼앗지 않는다. OverlayTabs는 상단 중앙 플로팅 탭과 전체 화면 콘텐츠를, OverlayCalendarView는 로컬 현재 월·주말 색·오늘 배경·선택 날짜 테두리를 소유한다. 관리 화면은 중앙 달력으로 시작하고 처음에는 오늘을 선택한다. 날짜 활성화로 파이·할 일·기록의 하루 화면으로 전환한다. Ctrl+[/]는 탭을 순환하며 모달·하루 화면 외부에서 Esc로 페이드 종료 후 이전 앱으로 복귀한다."
    - "Desktop/BackdropCapture: 오버레이는 Windows 캡처·화면 공유에 포함한다. 자기 화면 재캡처를 막기 위해 숨긴 상태에서 선택 모니터의 배경 한 프레임만 제한된 해상도로 메모리에 읽고 표시 중에는 고정한다. OverlayWindow의 동일 전환 값으로 배경 alpha·이미지 혼합·Gaussian blur를 조절하며 숨김 시 캡처 리소스를 해제한다. BackdropCaptureSession의 전용 background thread가 GDI와 버퍼를 소유하고 UI는 완성 프레임을 WriteableBitmap에만 반영한다. 숨김/종료는 UI를 기다리게 하지 않고 취소하며 worker가 진행 중 호출 반환 후 finally에서 해제한다. 이전 세션·모니터 프레임은 버리고 실패하면 색조만 유지한다. Desktop/Native는 전경 창이 Windows 캡처 도구인지(최소화·DWM 숨김 제외) 확인한다. OverlayWindow는 보이는 동안만 감시해 캡처 도구가 전경이면 Topmost를 해제하고 전경을 벗어나면 포커스를 빼앗지 않고 복구하며, 명시적 열기는 캡처 도구가 있어도 맨 앞에 활성화한다(ADR0092). CoverScreen은 이 상태를 보존한다. 화면을 저장하거나 AI로 전달하지 않는다."
    - "Facet.Plugins/CachedShadow (Facet.Widgets, shared by the app and plugins): 탭·달력·날짜 패널의 빈 그림자 배경만 기존 effect/shape/DPI로 사전 렌더링해 인스턴스별 작은 atlas와 cropped view를 재사용한다. 크기·색·모서리·effect·DPI 변경 때만 다시 만들며 전경 텍스트·입력·부모는 캐시하지 않는다."
    - "Desktop/Design: 의미 기반 토큰과 공통 컴포넌트. 화면은 같은 색/간격/타이포그래피와 포커스 상태를 사용한다. Tokens.AppFontFamily와 공통 스타일은 앱 전체 Pretendard 서체를 선언하고 Typography는 Design/Fonts의 번들 Regular/Medium/SemiBold/Bold 글꼴과 C# 그리기·트레이 GDI/GDI+ 로드를 소유한다. 글꼴은 시스템 설치 없이 사용하고 트레이 메뉴 수명 종료 때 메모리 글꼴을 해제하며 원본 라이선스를 배포한다. AppIcon은 같은 module의 Facet.ico를 검증·로드해 창·트레이에 제공하고 Controller는 native Icon을 종료 시 해제한다. Desktop·Launcher·Cli는 같은 ICO를 실행 파일에 포함한다. Scrolling.xaml은 앱 전체 ScrollViewer/ScrollBar 기본 템플릿을 소유한다. 막대 두께 4 DIP·끝 반경 2 DIP를 사용하고 실제 표시된 스크롤바에만 20 DIP 전용 영역을 예약한다. ComboBox 화살표는 공통 벡터 Chevron 아이콘이다. CheckBox는 Components의 전역 템플릿(18 DIP 둥근 상자, 켜짐은 Mint 채움과 OnAccent 체크, 키보드 포커스 링)을 사용한다. 새 화면은 공통 스타일을 사용하고 개별 스크롤바 템플릿을 복제하지 않는다. 내용 호스트·목록 가상화·스크롤 명령은 보존한다."
    - "Core/UserReminders: 선택 필드 Reminders에 사용자 일정·알림, idempotency key, 완료·취소·전달 상태를 보관하고 명령 검증·중복 생성 방지·오늘 카드 투영을 소유한다. Desktop만 Store로 저장하며 5초 Tick으로 마감 알림을 확인한다. 알림을 새로 등록하는 경로(CLI·MCP)는 ADR0105에서 제거했고 저장된 알림의 전달만 남는다."
    - "Desktop/LayoutInspector: 오버레이 F8 디버그 토글과 hover 대상 영역·크기 Adorner를 소유한다. 디버그 표시는 hit test와 레이아웃을 변경하지 않고 세션 메모리에만 유지한다."
    - "Core/CalendarNotes: AppData v2의 선택 필드 CalendarDays에 날짜별 자유 할 일·완료 상태·노트를 검증·갱신한다. SchedulePlugin/OverlayDayEditor는 날짜 클릭 편집·자동 저장·노트 보기/편집 전환·저장 실패 시 초안 보존을 소유하고 플러그인 저장소(IPluginStore)를 사용한다. SchedulePlugin/OverlayNoteMarkdown은 고정 버전 Markdig AST를 WPF 텍스트로 표시하며 외부 콘텐츠를 읽지 않는다. Markdown 원문을 저장하고 CalendarDays는 AI 요청에 포함하지 않는다."
    - "Checks: Core의 결정적 검증과 JournalChecks의 합성 암호화 저장·앱 수명·WPF 검증. 별도 데이터 디렉터리를 사용하며 실제 사용자 기록은 사용하지 않는다."
    - "Checks 실행 정책: 기본 check/build는 테스트 창을 띄우지 않는다. 달력·탭 변경은 -OverlayUi로 화면 밖에서 검증하고 실행기 변경은 -Launcher를 선택한다. 격자·빨간 배경은 블러/캡처/배경 애니메이션을 수정할 때만 -OverlayVisuals로 실행하며 일반 기능·단축키 추가마다 반복하지 않는다."
  dependency_rules:
    - "Desktop -> Microsoft.Web.WebView2 (world backdrop only, ADR0090)."
    - "Desktop -> Plugins; external plugins -> Plugins and the pure Core, both supplied by the host (PluginHost shares Facet.Plugins and Facet.Core; ADR0101); Plugins has no dependency on Core or Desktop."
    - "Desktop -> Core; Checks -> Core; JournalChecks -> Desktop/Core (검증 전용); Core에는 WPF/WinForms/파일 암호화 의존성 없음."
    - "Launcher는 Core/Desktop을 참조하지 않는다. Desktop은 Launcher/LaunchProtocol.cs와 ReleaseManifest.cs의 배포·인스턴스 식별 규약만 source link로 공유한다. JournalChecks -> Launcher는 배포 검증 전용이다."
  public_interfaces: ["Facet.Plugins: WidgetTheme (ADR0086, IsSoftHud ADR0090; IsCatHud obsolete and always false, ADR0110), IWidgetState {Type \"<pluginId>/<widget>@<version>\", Json, Changed, Act(name,argsJson)} optional on a widget view (ADR0110), IWidgetLayer and IWidgetInput (ADR0101), CachedShadow, IFacetPlugin, IWidgetRegistry, IPluginShell, LauncherMode, ILauncherHost, ILauncherSession, PluginHotkey (ADR0084), IPluginStore (ADR0081), WidgetDescriptor, WidgetContext, IWidgetModal, IModalHandle, ModalOptions, IFacetWorkspace, PluginAgentTool, IWidgetData, IPluginSettings, PluginSettingsSection (ADR0075); plugin.json {id,name,version,assembly}", "skin.json {id,name,version,colors{token:#hex},theme{ThemeManifest slots, world{page,scenes}, fonts{body,heading}, widgets[state type, at most 32, needs world]}} (ADR0088, ADR0091, ADR0110)", "Package zip with one root manifest; registry index.json {packages:[{kind,id,name,version,author,description,url,sha256}]} (ADR0088)","AppData schemaVersion 2 (reads v1; optional Workspace (GridVersion, tabs with optional board View and origin-relative widget placements, ADR0074),EnabledPlugins (id + SHA-256), WidgetStores, PluginSettings,SchedulePresets (up to 50 #RRGGBB/label pairs; missing derives from used schedules, ADR0072); Conditions (input only, ADR0081), Sleep/RemovedSleep (input only, ADR0083), AgentChatReferences (input only, ADR0084), the old Settings chat and voice fields (input only, ADR0084), CalendarDays[].Schedules, Reminders, Projects, ProjectJournals, Settings.Skin/LauncherSearchEngine/WeatherRegionId/ShowOverlayOnLaunch/OverlayBlurRadius/OverlayShowMilliseconds/OverlayHideMilliseconds/OverlayTransparencyPercent/OverlayBackgroundColor)", "SleepEntry wake-date key", "Store.Load/Save", "calendar.dat CalendarStoreFile schemaVersion 1 (ADR0076)", "plugin-data/facet.condition.dat {SchemaVersion:1,Conditions:[{At,Kind}]} (ADR0081)", "plugin-data/facet.sleep.dat {SchemaVersion:1,Sleep:[],Removed:[]} (ADR0083)", "plugin-data/facet.chat.dat {SchemaVersion:1,Chats:[{ThreadId,HostId,ProjectId,Title,CreatedAt}]} (ADR0084)", "CalendarNotes.SchedulesForDate/SaveSchedule: canonical start-date schedules, clipped day projections and atomic edits", "Launcher latest.json schemaVersion 1: executable = releases/<build>/Facet.exe; LaunchProtocol instance/update/cancel/version events"]
  invariants:
    - "제품명·프로젝트·namespace·실행 파일·새 배포 경로는 Facet으로 통일한다. 기존 AppUserModelID·자동 실행 키·IPC·기본 데이터 경로는 호환 식별자로 유지해 기록과 단일 인스턴스를 분리하지 않는다. 현재 배포본은 유지하며 사용하지 않는 과거 배포본은 사용자 요청으로 제거한다. 기존 고정 바로가기는 새 Facet 실행기로 한 번 다시 고정한다."
    - "고정 실행기는 빌드 성공 후 원자적으로 갱신된 latest.json의 releases 하위 앱만 실행한다. Desktop은 기본 데이터 경로의 앱 시작 시 이미 켜진 HKCU Run 등록만 고정 실행기와 --autostart --tray로 보정한다. 꺼진 자동 실행은 켜지 않으며 --data-dir/--storage-check 검증 실행은 실제 등록을 변경하지 않는다. 실행기가 없으면 버전별 exe를 등록하지 않고 보정을 건너뛰며 명시적 켜기는 실패한다. 이전 실행본을 강제 종료하거나 미저장 입력을 버리지 않는다. 작업 표시줄 AppUserModelID는 버전에 따라 바꾸지 않는다."
    - "건강 기록은 자동 첨부·외부 전송하지 않는다. 예외: 사용자가 연결한 에이전트가 facet_* 컨디션·수면 도구를 호출할 때 그 요청·결과만 해당 모델 제공자로 전송된다(ADR0069). 알 수 없는 값은 null이며 0으로 치환하지 않는다."
    - "대시보드 날씨 요청에는 Windows 현재 좌표 또는 직접 선택한 지역의 대표 좌표만 사용하며 ipapi는 호출하지 않는다. 수면·작업·노트·설정 기록을 전송하지 않는다. 위치는 로컬 한국어 지명으로 표시하며 출처·IP 기준 문구는 날씨 행에서 제거한다. 데이터 출처는 문서에 유지한다. 연결 실패 시 이전 값과 기준 시각을 유지하거나 미확인으로 표시한다."
    - "사용자 알림은 저장 성공 후에만 전달 처리를 확정하며 재시작 후 전달된 ID를 다시 알리지 않는다."
    - "같은 알림 ID는 재시작 후에도 중복 표시하지 않는다."
    - "원자적 교체와 암호화 백업으로 이전 저장을 보존한다."
commands:
  setup: "dotnet restore impls/Facet/Facet.csproj"
  test: "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check.ps1"
  lint: null
  # Publishes a release and switches latest.json so the pinned launcher runs it.
  build: "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build.ps1"
  # Portable zip for other PCs; does not touch the local deployment.
  package: "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1"
  architecture: null
