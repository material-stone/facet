}

/* ---------- 앱과의 연결 ---------- */
const BUILDERS = { market: buildStreet, lakeside: buildNature, cave: buildCave };
const FRAME_MS = 1000 / 30;
const world = { engine: null, ids: [], built: {}, index: 0, visible: false, last: 0, frameAt: 0 };
function report(type, message) { if (window.chrome && chrome.webview) chrome.webview.postMessage({ type, message: String(message || '') }); }
function sceneAt(index) {
  const id = world.ids[index];
  if (!world.built[id]) world.built[id] = world.engine.addScene(BUILDERS[id](world.engine.upload));
  return world.built[id];
}
function showScene(index) { world.index = index; world.engine.scene = sceneAt(index); world.engine.show(index); }
function tick(now) {
  requestAnimationFrame(tick);
  if (!world.visible || now - world.frameAt < FRAME_MS - 2) return;
  const dt = Math.min(.1, (now - (world.frameAt || now)) / 1000); world.frameAt = now;
  try { world.engine.frame(dt); } catch (err) { world.visible = false; report('failed', err && err.message); }
}
function receive(m) {
  try {
    if (m.scenes) {
      world.ids = m.scenes; world.engine = new Engine(document.getElementById('world'));
      showScene(0); requestAnimationFrame(tick); report('ready');
    }
    if (!world.engine) return;
    if (m.weather) world.engine.weather = m.weather;
    if (m.visible !== undefined) { world.visible = m.visible; world.frameAt = 0; if (m.visible) world.engine.flash = 1; }
    if (m.next) showScene((world.index + 1) % world.ids.length);
    if (m.look) { world.engine.mx = m.look[0]; world.engine.my = m.look[1]; }
  } catch (err) { report('failed', err && err.message); }
}
if (window.chrome && chrome.webview) chrome.webview.addEventListener('message', (e) => receive(e.data));
window.addEventListener('error', (e) => report('failed', e.message));
report('loaded');
