<style>html,body{margin:0;height:100%;background:#fbdfd0;overflow:hidden}canvas{display:block;width:100vw;height:100vh}

}

  o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur*.8);env(g,t,peak,.006,dur);
  o.connect(g).connect(master);o.start(t);o.stop(t+dur*1.6+.05)}
function burst(freq,q,type,dur,peak,at,rate){const a=ctx();if(!a)return;const t=a.currentTime+(at||0),s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=noiseBuf();s.playbackRate.value=rate||1;f.type=type||'bandpass';f.frequency.value=freq;f.Q.value=q;env(g,t,peak,.004,dur);

function loop(freq,q,type){const a=ctx();if(!a)return null;const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=noiseBuf();s.loop=true;f.type=type;f.frequency.value=freq;f.Q.value=q;g.gain.value=0;s.connect(f).connect(g).connect(master);s.start();return {s,f,g}}

const S={
  /* Petting: a low purr (amplitude-modulated, low-passed noise) and a tiny rising "mrrp". */
  purr(d){const a=ctx();if(!a)return;d=d||2;
    if(!purrBuf||purrBuf.duration<d){const sr=a.sampleRate,b=a.createBuffer(1,Math.ceil(sr*d),sr),ch=b.getChannelData(0);let lp=0,lp2=0;

function shadowEll(x,y,rx,ry,a){softSh(c,x+3*u,y+1*u,rx,ry,a);softSh(c,x+1*u,y,rx*.62,ry*.55,.7*(a||1))}
function bedT(){const k=depthK(.90),U=u*k,px=.17*W,py=.90*H,a=cush.a;c.save();c.translate(px,py);c.scale((1+a)*U,U/(1+a));c.strokeStyle=C.ol;c.lineWidth=1.1;c.lineJoin='round'}
function drawBedBack(){const k=depthK(.90),U=u*k;shadowEll(.17*W,.90*H,33*U,7.5*U);bedT();
  c.fillStyle=C.dpink;c.beginPath();ell(c,0,-9,30,9);c.fill();c.stroke();
  c.fillStyle=C.pink;c.beginPath();ell(c,0,-15,30,9);c.fill();c.stroke();
  c.fillStyle=C.cream;c.beginPath();ell(c,0,-14,19,5.5);c.fill();c.stroke();
  c.fillStyle='rgba(110,65,40,.12)';c.beginPath();c.ellipse(0,-14,19,5.5,0,Math.PI,0);c.ellipse(0,-12.6,17,4,0,0,Math.PI,true);c.fill();
  c.restore()}
function drawBedFront(){bedT();
  c.fillStyle=C.dpink;c.beginPath();c.ellipse(0,-15,30,9,0,0,Math.PI);c.lineTo(-30,-9);c.ellipse(0,-9,30,9,0,Math.PI,0,true);c.closePath();c.fill();c.stroke();
  c.fillStyle=C.pink;c.beginPath();c.ellipse(0,-15,30,9,0,0,Math.PI);c.ellipse(0,-14,19,5.5,0,Math.PI,0,true);c.closePath();c.fill();c.stroke();
  c.strokeStyle='rgba(255,241,223,.95)';c.lineWidth=.6;c.setLineDash([1.6,1.6]);c.beginPath();c.ellipse(0,-14.6,25,7.3,0,.15,Math.PI-.15);c.stroke();c.setLineDash([]);
  c.restore()}
function boxPts(){const k=depthK(.84),U=u*k,px=.70*W,py=.84*H,w=19*U,h=22*U;
  const to=p=>({x:lerp(p.x,VP.x,.13),y:lerp(p.y,VP.y,.13)});
  const FLb={x:px-w,y:py},FRb={x:px+w,y:py},FLt={x:px-w,y:py-h},FRt={x:px+w,y:py-h};
  return {U,px,py,w,h,FLb,FRb,FLt,FRt,BLt:to(FLt),BRt:to(FRt),BLb:to(FLb)}}
function poly(pts,fill){c.fillStyle=fill;c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.closePath();c.fill();c.stroke()}
function drawBoxBack(){
  const B=boxPts();c.strokeStyle=C.ol;c.lineWidth=1.1*u;c.lineJoin='round';
  shadowEll(B.px-3*B.U,B.py,24*B.U,5.5*B.U);
  poly([B.BLt,{x:B.BLt.x-3*B.U,y:B.BLt.y-12*B.U},{x:B.BRt.x+2*B.U,y:B.BRt.y-13*B.U},B.BRt],C.w1);
  poly([B.FLt,B.FRt,B.BRt,B.BLt],C.w3);
  c.fillStyle='rgba(90,55,40,.25)';c.beginPath();c.moveTo(B.BLt.x,B.BLt.y);c.lineTo(B.BRt.x,B.BRt.y);c.lineTo(B.BRt.x,B.BRt.y+4*B.U);c.lineTo(B.BLt.x,B.BLt.y+4*B.U);c.fill();
}
function drawBoxFront(){
  const B=boxPts();c.strokeStyle=C.ol;c.lineWidth=1.1*u;c.lineJoin='round';
  poly([B.BLb,B.FLb,B.FLt,B.BLt],C.w2);
  poly([B.FLb,B.FRb,B.FRt,B.FLt],C.w1);
  c.fillStyle='rgba(255,247,239,.55)';c.fillRect(B.px-3*B.U,B.FLt.y+.6*u,6*B.U,9*B.U);
  c.strokeStyle='rgba(169,117,63,.6)';c.lineWidth=.6*u;c.beginPath();c.moveTo(B.px-11*B.U,B.py-6*B.U);c.lineTo(B.px-5*B.U,B.py-6*B.U);c.moveTo(B.px-11*B.U,B.py-4*B.U);c.lineTo(B.px-7*B.U,B.py-4*B.U);c.stroke();
  c.strokeStyle=C.ol;c.lineWidth=1.1*u;poly([B.FLt,B.BLt,{x:B.BLt.x-12*B.U,y:B.BLt.y+7*B.U},{x:B.FLt.x-11*B.U,y:B.FLt.y+8*B.U}],C.w1);
}

function pomTip(){const p=G.pom;return {x:p.x+Math.sin(pom.a)*p.l,y:p.y+Math.cos(pom.a)*p.l}}
function glow(a,blur){if(a>.02){c.shadowColor='rgba(255,236,170,'+Math.min(1,a).toFixed(2)+')';c.shadowBlur=blur}else{c.shadowColor='transparent';c.shadowBlur=0}}
function drawPom(){const p=G.pom,t=pomTip(),lag=clamp(pom.v*.35,-3,3)*u;
  c.strokeStyle=C.ol;c.lineWidth=.6*u;c.lineCap='round';c.beginPath();c.moveTo(p.x,p.y);c.quadraticCurveTo((p.x+t.x)/2-lag,(p.y+t.y)/2,t.x,t.y);c.stroke();
  c.save();c.translate(t.x,t.y);c.rotate(-pom.a);c.fillStyle=C.pink;c.lineWidth=.9*u;
  glow(hov.pom,6*u);c.beginPath();circ(c,0,0,p.r);c.fill();glow(0);c.stroke();
  c.strokeStyle=C.dpink;c.lineWidth=.5*u;c.beginPath();c.arc(0,0,p.r*.55,.4,2.2);c.stroke();
  c.fillStyle='rgba(255,247,239,.9)';c.beginPath();circ(c,-p.r*.35,-p.r*.4,p.r*.26);c.fill();c.restore()}

let litAmt=0;
function drawCatObj(){
  const k=depthK(cat.y),U=u*k,px=cat.x*W,py=cat.y*H;
  if(!cat.inBox){const sh=1-Math.min(.5,cat.z/40);const curl=cat.P.curl>.5;if(cat.lift>.5)softSh(c,px+1.5*U,py-cat.lift*U,(curl?20:15)*U,3.2*U,.75);else shadowEll(px+(curl?0:-3*U*Math.sign(cat.faceVis)),py,(curl?25:22)*U*sh,4.5*U*sh)}
  const b=cbx;b.setTransform(1,0,0,1,0,0);b.clearRect(0,0,cb.width,cb.height);
  const ox=cb.width/2,oy=cb.height-CBB;
  const fv=Math.sign(cat.faceVis)||1;let tsx=1,tsy=1;
  if(cat.turn>=0){const t=cat.turn;if(t<.06){const q=t/.06;tsx=1+.06*q;tsy=1-.08*q}else{const e=easeOutBack(clamp((t-.06)/.1,0,1));tsx=lerp(1.06,1,e);tsy=lerp(.92,1,e)}}
  const a=cat.sq,purr=0;
  b.translate(ox+purr,oy-(cat.lift+cat.z)*U);b.scale(fv*U*RIG*tsx*(1+a),U*RIG*tsy/(1+a));
  drawRig(b);
  b.setTransform(1,0,0,1,0,0);
  const lit=.14*litAmt*cat.lit,moon=.10*WP.night*cat.lit;
  if(lit>.01||moon>.01){b.globalCompositeOperation='source-atop';
    if(lit>.01){b.fillStyle='rgba(255,240,190,'+lit+')';b.fillRect(0,0,cb.width,cb.height)}
    if(moon>.01){b.fillStyle='rgba(170,190,255,'+moon+')';b.fillRect(0,0,cb.width,cb.height)}
    b.globalCompositeOperation='source-over'}
  if(cat.inBox){const B=boxPts();c.save();c.beginPath();c.rect(0,0,W,B.FLt.y);c.clip();glow(hov.cat,5*u);c.drawImage(cb,px-ox,py-oy);if(hov.cat>.02)c.drawImage(cb,px-ox,py-oy);c.restore()}
  else{glow(hov.cat,5*u);c.drawImage(cb,px-ox,py-oy);if(hov.cat>.02)c.drawImage(cb,px-ox,py-oy);glow(0)}
}
function drawYarn(){
  if(!yarn.on)return;const k=depthK(yarn.y),U=u*k,px=yarn.x*W,gy=yarn.y*H,py=gy-yarn.z*U;
  const sh=1-Math.min(.6,yarn.z/80);shadowEll(px,gy,9*U*sh,2.4*U*sh);
  c.strokeStyle=C.dpink;c.lineWidth=.6*u;c.beginPath();c.moveTo(px,py-3*U);
  const tr=yarn.trail;for(let i=2;i<tr.length;i+=2){const p=tr[i],kk=depthK(p.y);c.lineTo(p.x*W-(i*.9)*U*Math.sign(yarn.vx||1),p.y*H-p.z*u*kk-2*U+Math.sin(i+T*3)*1.2*U)}
  if(tr.length<4){c.quadraticCurveTo(px-10*U,py+2*U,px-16*U,gy-1*U)}c.stroke();
  const a=yarn.sq,yr=yarn.r/7;c.save();c.translate(px,py);c.scale((1+a)*yr,yr/(1+a));c.translate(0,-7*U);
  c.fillStyle=C.pink;c.strokeStyle=C.ol;c.lineWidth=1.1*u;c.beginPath();circ(c,0,0,7*U);glow(hov.yarn,7*u);c.fill();glow(0);c.stroke();
  c.save();c.beginPath();circ(c,0,0,7*U);c.clip();c.rotate(yarn.rot);c.strokeStyle=C.dpink;c.lineWidth=.6*u;
  for(let i=-2;i<=2;i++){c.beginPath();c.ellipse(i*2.6*U,0,2.2*U,7.5*U,.5,0,TAU);c.stroke()}
  c.beginPath();c.ellipse(0,0,7.2*U,2.4*U,-.7,0,TAU);c.stroke();c.restore();
  c.strokeStyle='rgba(255,241,223,.85)';c.lineWidth=1*u;c.beginPath();c.arc(0,0,4.8*U,-2.5,-1.6);c.stroke();
  c.restore();
}

function heartPath(g,s){g.beginPath();g.moveTo(0,s*.35);g.bezierCurveTo(-s*1.1,-s*.35,-s*.45,-s*1.05,0,-s*.45);g.bezierCurveTo(s*.45,-s*1.05,s*1.1,-s*.35,0,s*.35);g.closePath()}
function drawParticles(){
  for(const p of pool){if(!p.on||p.type==='leaf')continue;const t=p.life/p.max,al=1-t*t;c.save();c.translate(p.x,p.y);c.globalAlpha=al;c.lineJoin='round';
    if(p.type==='dust'){c.fillStyle='rgba(255,241,223,.85)';c.beginPath();circ(c,0,0,p.size*(1+t));c.fill()}
    else if(p.type==='heart'){const s=p.size*easeOutBack(Math.min(1,p.life*4));heartPath(c,s);c.fillStyle=C.pink;c.fill();c.strokeStyle=C.ol;c.lineWidth=.6*u;c.stroke()}
    else if(p.type==='sparkle'){const s=p.size*(1-t*.5);c.rotate(p.life*3);c.fillStyle=C.butter;c.beginPath();for(let i=0;i<8;i++){const r=i%2?s*.35:s,a=i/8*TAU;i?c.lineTo(Math.cos(a)*r,Math.sin(a)*r):c.moveTo(r,0)}c.closePath();c.fill()}
    else if(p.type==='nom'){c.font='700 '+Math.round(p.size)+'px "Jua", "Gowun Dodum", cursive, sans-serif';c.textAlign='center';c.lineWidth=1.6*u;c.strokeStyle='#fff7ef';c.strokeText('냠',0,0);c.fillStyle=C.dpink;c.fillText('냠',0,0)}
    else if(p.type==='purr'){c.rotate(Math.sin(p.life*9)*.12);c.font='700 '+Math.round(p.size)+'px "Jua", "Gowun Dodum", cursive, sans-serif';c.textAlign='center';c.lineWidth=1.6*u;c.strokeStyle='#fff7ef';c.strokeText('골골',0,0);c.fillStyle=C.sub;c.fillText('골골',0,0)}
    else if(p.type==='z'){c.font='700 '+Math.round(p.size*(.7+t*.5))+'px "Jua", "Gowun Dodum", cursive, sans-serif';c.lineWidth=1.8*u;c.strokeStyle='#fff7ef';c.strokeText('z',0,0);c.fillStyle=C.sub;c.fillText('z',0,0)}
    else if(p.type==='note'){const s=p.size;c.fillStyle=C.dpink;c.strokeStyle=C.dpink;c.lineWidth=.9*u;c.lineCap='round';c.beginPath();ell(c,0,0,s*.55,s*.4,-.4);c.fill();c.beginPath();c.moveTo(s*.5,-.1*s);c.lineTo(s*.5,-1.8*s);c.quadraticCurveTo(s*1.1,-1.5*s,s*1.1,-.9*s);c.stroke()}
    else if(p.type==='bang'){const s=p.size*easeOutBack(Math.min(1,p.life*6));c.font='700 '+Math.max(1,Math.round(s))+'px "Jua", "Gowun Dodum", cursive, sans-serif';c.textAlign='center';c.lineWidth=2.2*u;c.strokeStyle='#fff7ef';c.strokeText('!',0,0);c.fillStyle=C.dpink;c.fillText('!',0,0)}
    c.restore()}
}

function render(){
  c.setTransform(1,0,0,1,0,0);c.globalCompositeOperation='source-over';c.globalAlpha=1;c.clearRect(0,0,W,H);
  if(shakeT>0){const m=1.5*u*shakeT/.12;c.translate(rnd(-m,m),rnd(-m,m))}
  drawSky();
  c.drawImage(room,0,0);
  drawWindowProps();
  litAmt=Math.max(0,WP.L-WP.clearW*.35*sky.occl);
  if(litAmt>.01)for(const e of [-.012,0,.012])panes('rgba(255,240,190,'+(.5/3*litAmt)+')',e);
  const items=[{y:.80,d:drawPom},{y:.8998,d:drawBedBack},{y:.9002,d:drawBedFront},{y:.8399,d:drawBoxBack},{y:.8401,d:drawBoxFront},{y:cat.inBox?.84:(Math.abs(cat.x-.17)<.2?.9003:cat.y),d:drawCatObj}];
  if(yarn.on)items.push({y:yarn.y,d:drawYarn});
  if(cat.act&&cat.act.bowl!==undefined&&cat.pose==='eat'&&G.bowlF){const f=G.bowlF,hw=f.c.width/2,sx=cat.act.bowl?hw:0;items.push({y:.9004,d:()=>c.drawImage(f.c,sx,0,hw,f.c.height,f.x+sx,f.y,hw,f.c.height)})}
  items.sort((a,b)=>a.y-b.y).forEach(it=>it.d());
  drawRays(litAmt);
  drawParticles();
  if(WP.night>.01||WP.rain>.01){c.globalCompositeOperation='multiply';
    if(WP.night>.01){c.fillStyle='rgba(80,88,160,'+(.55*WP.night)+')';c.fillRect(0,0,W,H)}
    if(WP.rain>.01){c.fillStyle='rgba(150,160,175,'+(.22*WP.rain)+')';c.fillRect(0,0,W,H)}
    c.globalCompositeOperation='lighter';if(WP.night>.01)for(const e of [-.012,0,.012])panes('rgba(170,190,255,'+(.04*WP.night)+')',e);c.globalCompositeOperation='source-over'}
  if(nightOn>=0&&G.bulbs&&WP.night>.05){const n=Math.floor((T-nightOn)/.8)+1;c.globalCompositeOperation='lighter';
    const vis=bl=>bl.x>G.wx+11*u&&bl.x<G.wx+G.ww-11*u;
    {const gx=G.wx+G.ww/2,gy=G.wy+4*u,g=c.createRadialGradient(gx,gy,10*u,gx,gy,95*u);g.addColorStop(0,'rgba(255,214,150,'+(.20*WP.night)+')');g.addColorStop(1,'rgba(255,214,150,0)');c.save();c.beginPath();c.rect(0,0,W,H);c.rect(G.sx,G.sy,G.sw,G.sh);c.clip('evenodd');c.fillStyle=g;c.fillRect(gx-95*u,gy-95*u,190*u,190*u);c.restore()}
    G.bulbs.forEach((bl,i)=>{if(i>=n||!vis(bl))return;const fl=WP.night*(.85+.15*Math.sin(T*3+i)),g=c.createRadialGradient(bl.x,bl.y,0,bl.x,bl.y,11*u);g.addColorStop(0,'rgba(255,224,138,'+(.55*fl)+')');g.addColorStop(1,'rgba(255,224,138,0)');c.fillStyle=g;c.beginPath();circ(c,bl.x,bl.y,11*u);c.fill()});
    c.globalCompositeOperation='source-over';c.globalAlpha=WP.night;G.bulbs.forEach((bl,i)=>{if(i>=n||!vis(bl))return;c.fillStyle=bl.col;c.beginPath();ell(c,bl.x,bl.y,1.6*u,2*u);c.fill()});c.globalAlpha=1}
  c.drawImage(fg,0,0);
  for(const r of ripples){const t=r.t/.55;c.strokeStyle='rgba(255,247,239,'+(1-t)+')';c.lineWidth=1.1*u;c.beginPath();circ(c,r.x,r.y,lerp(2,18,easeOutCubic(t))*u);c.stroke()}
}


function hitAt(p){
  if(G.pom){const t=pomTip();if(Math.hypot(p.x-t.x,p.y-t.y)<6.5*u)return 'pom'}
  if(yarn.on){const k=depthK(yarn.y),U=u*k;if(Math.hypot(p.x-yarn.x*W,p.y-(yarn.y*H-(yarn.z+7)*U))<10*U)return 'yarn'}
  const k=depthK(cat.y),U=u*k,cx=cat.x*W,cy=cat.y*H-(cat.lift+cat.z)*U;
  if(Math.abs(p.x-cx)<34*U&&p.y>cy-62*U&&p.y<cy+5*U)return 'cat';
  return p.y>=.80*H&&p.y<=.97*H?'floor':null}
function floorPt(p){const x=clamp(p.x/W,.10,.64);return {x,y:x<.30?clamp(p.y/H,.935,.95):clamp(p.y/H,.82,.94)}}
function callCat(p){const f=floorPt(p);interrupt();cat.last='call';cat.earTw=.3;if(Math.random()<.3)snd('mew');
  Q(go(f.x,f.y,.09),hold('sit',2.2,{start:()=>{setSlow(1.6)}}))}

/* A host click at canvas pixel p (the window itself takes no pointer input). */
function clickAt(p){
  if(reduce)return;
  const hk=hitAt(p);ripples.push({x:p.x,y:p.y,t:0});
  if(hk==='pom'){const t=pomTip();kick(pom,(p.x<t.x?1:-1)*7);snd('ding');cat.earTw=.3;spawn('sparkle',t.x,t.y-4*u,{max:.5,size:3.5*u,vy:-18*u});
    if(!(cat.act&&cat.act.pom)&&!cat.q.some(a=>a.pom)){interrupt();cat.last='pomPlay';BEH.pomPlay(true);if(Math.random()<.35)snd('mew')}
    return}
  if(hk==='yarn'&&yarn.z<1){yarn.vx=(p.x<yarn.x*W?1:-1)*rnd(.10,.16);yarn.vy=rnd(-.02,.02);yarn.vz=rnd(95,130);yarn.b=0;yarn.sq=.3;yarn.hunted=false;return}
  if(hk==='cat'){pet();return}
  dropYarn(p.x/W,p.y);
}

/* ---------- Loop ---------- */
let running=false,last=0,visible=false,started=false;
function frame(now){if(!running)return;const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
  try{update(dt);render()}catch(err){running=false;report('failed',err&&err.message);return}
  requestAnimationFrame(frame)}
function setRun(){const want=started&&visible&&!document.hidden&&!reduce;
  if(want&&!running){running=true;last=performance.now();requestAnimationFrame(frame)}else if(!want)running=false}
document.addEventListener('visibilitychange',setRun);
let rzT=0;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{bake();if(!running)render()},150)});

/* ---------- Host protocol (same as the voxel world page) ---------- */
function report(type,message){if(window.chrome&&chrome.webview)chrome.webview.postMessage({type,message:String(message||'')})}
function start(){
  bake();started=true;
  if(reduce){wT=1;blendW();cat.x=.33;cat.y=.88;cat.pose='loaf';Object.assign(cat.P,POSE.loaf);cat.act={t:'hold',pose:'loaf',dur:1e9,time:0}}
  render();report('ready');
}
function receive(m){
  try{
    if(!m)return;
    if(window.__catSound)window.__catSound.receive(m);
    if(window.__catWidgets)window.__catWidgets.receive(m);   // widget layer works independently of the room
    if(m.scenes&&!started)start();   // single scene ("room"); the list itself is not needed
    if(!started)return;
    if(m.weather)setWeather(m.weather,!visible);
    if(m.visible!==undefined){visible=!!m.visible;if(visible&&reduce){nightF=nightOf(new Date());blendW();render()}setRun()}
    if(m.next&&typeof m.x==='number'&&typeof m.y==='number')clickAt({x:clamp(m.x,0,1)*W,y:clamp(m.y,0,1)*H});
    if(reduce&&m.weather)render();
  }catch(err){report('failed',err&&err.message)}
}
window.receive=receive;
window.__catRoom={cat,yarn,update,dropYarn,moodReact,startHunt,BEH,render,clickAt,hitAt,setW:setWeather,get T(){return T},get WP(){return WP}};
if(window.chrome&&chrome.webview)chrome.webview.addEventListener('message',e=>receive(e.data));
window.addEventListener('error',e=>report('failed',e.message));
report('loaded');
})();
</script></body></html>
